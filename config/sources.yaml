    required_fields: [symbol, company_name, industry, series, isin]
    status: "live_validated"
    historical_policy: "immutable_snapshots_only"
  nse_security_master:
    description: "NSE security and series reference data"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/all-reports"
    frequency: "daily_or_on_change"
    required_fields: [symbol, series, isin]
    status: "captured_quarantined_freshness_mismatch"
    download_catalogue_api: "https://www.nseindia.com/api/daily-reports?key=CM"
  nse_fo_eligibility:
