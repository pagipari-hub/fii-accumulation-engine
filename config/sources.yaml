# Register every upstream dataset with provenance before ingestion.
# Source contracts are documented in docs/data-source-register.md.
sources:
  nse_nifty500_constituents:
    description: "Official current Nifty 500 constituent CSV snapshot"
    publisher: "NSE Indices"
    reference_url: "https://www.niftyindices.com/indices/equity/broad-based-indices/NIFTY-500"
    download_url: "https://www.niftyindices.com/IndexConstituent/ind_nifty500list.csv"
    frequency: "monthly_or_on_change"
    required_fields: [symbol, company_name, industry, series, isin]
    status: "live_validated"
    historical_policy: "immutable_snapshots_only"
  nse_security_master:
    description: "NSE security and series reference data"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/all-reports"
    frequency: "daily_or_on_change"
    required_fields: [symbol, series, isin]
    status: "captured_quarantined_freshness_mismatch"
    download_catalogue_api: "https://www.nseindia.com/api/daily-reports?key=CM"
  nse_fo_eligibility:
    description: "Current individual-stock F&O membership; contract-level fields are maintained separately"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/all-reports-derivatives"
    frequency: "daily_or_on_change"
    required_fields: [symbol, fno_status]
    status: "current_membership_live_validated_contract_master_quarantined"
    download_catalogue_api: "https://www.nseindia.com/api/daily-reports?key=FO"
  nse_fo_individual_stock_underlyings:
    description: "Official current list of individual securities underlying NSE equity derivatives"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/products-services/equity-derivatives-list-underlyings-information"
    download_url: "https://www.nseindia.com/api/underlying-information"
    frequency: "daily_or_on_change"
    required_fields: [symbol, underlying, serialNumber]
    status: "live_validated_current_membership_only"
    source_effective_date: "not_supplied; record retrieval timestamp only"
  nse_fo_stock_introduction_exclusion_tracker:
    description: "Effective-dated NSE F&O stock introductions and exclusions with circular references"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/static/products-services/equity-derivatives-contract-information"
    frequency: "daily_or_on_change"
    required_fields: [symbol, action, effective_date, circular_link]
    status: "live_validated_effective_dated_change_history"
    archive_policy: "content_addressed_xlsx_and_parsed_event_manifest"
  nifty500_current_stock_fno_status:
    description: "Nifty 500 constituents classified by current NSE individual-stock F&O underlying membership"
    publisher: "NSE Indices + National Stock Exchange of India"
    inputs: [nifty500_constituents, nse_fo_individual_stock_underlyings, symbol_aliases]
    required_fields: [symbol, fno_status, fno_evidence, isin]
    status: "live_validated_current_snapshot"
    effective_date_semantics: "Nifty 500 exact effective date and F&O API effective date not supplied; source retrieval/freshness metadata retained"
  nse_fii_dii_cash_provisional:
    description: "NSE-exclusive and combined-market FII/FPI and DII cash activity"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/reports/fii-dii"
    frequency: "daily"
    required_fields: [trade_date, investor_category, buy_value, sell_value, net_value]
    status: "source_verified_adapter_pending"
    finality: "provisional"
    dataset_identity: "keep_nse_exclusive_and_combined_separate"
  nsdl_fpi_final:
    description: "Final FPI cash data"
    publisher: "NSDL"
    reference_url: "https://www.fpi.nsdl.co.in/web/Reports/Latest.aspx"
    frequency: "daily_or_as_published"
    required_fields: [trade_date]
    status: "reference_verified_schema_pending"
    finality: "final_when_published"
  cdsl_fpi_final:
    description: "Final FPI data published by CDSL"
    publisher: "CDSL"
    reference_url: "https://www.cdslindia.com/Publications/ForeignPortInvestor.html"
    frequency: "daily_or_as_published"
    required_fields: [trade_date]
    status: "reference_verified_schema_pending"
    finality: "final_when_published"
  nse_fo_udiff_bhavcopy:
    description: "Final UDiFF common derivatives bhavcopy"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/all-reports-derivatives"
    frequency: "daily"
    required_fields: [TradDt, BizDt, Sgmt, Src, FinInstrmTp, FinInstrmId, TckrSymb, XpryDt, StrkPric, OptnTp, OpnIntrst, ChngInOpnIntrst, TtlTradgVol, TtlTrfVal]
    status: "live_validated_current_capture"
    finality: "final"
    catalogue_api: "https://www.nseindia.com/api/daily-reports?key=FO"
    report_key: "FO-UDIFF-BHAVCOPY-CSV"
    archive_host: "nsearchives.nseindia.com"
    archive_policy: "raw_zip_and_parsed_csv_as_90_day_workflow_artifact; content_addressed_sha256_manifest_committed"
    last_live_validated_trade_date: "2026-11-06"
  nse_fo_contract_master:
    description: "F&O MII contract master"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/all-reports-derivatives"
    frequency: "daily_or_on_change"
    required_fields: [instrument_identifier, symbol, expiry]
    status: "captured_quarantined_freshness_mismatch"
    download_catalogue_api: "https://www.nseindia.com/api/daily-reports?key=FO"
  nse_fo_participant_oi:
    description: "Participant-category aggregate derivatives open interest"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/all-reports-derivatives"
    frequency: "daily"
    required_fields: [participant_category, instrument_group, long_positions, short_positions]
    status: "adapter_implemented_live_validation_pending"
    catalogue_api: "https://www.nseindia.com/api/daily-reports?key=FO"
    report_key: "FO-PARTICIPANTWISE-OI"
    attribution_scope: "participant_category_aggregate_not_stock_specific"
  nse_fo_participant_volume:
    description: "Participant-category aggregate derivatives trading volume"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/all-reports-derivatives"
    frequency: "daily"
    required_fields: [participant_category, instrument_group, long_positions, short_positions]
    status: "adapter_implemented_live_validation_pending"
    catalogue_api: "https://www.nseindia.com/api/daily-reports?key=FO"
    report_key: "FO-PARTICIPANTWISE-TRADING-VOL"
    attribution_scope: "participant_category_aggregate_not_stock_specific"
  nse_fii_derivatives_statistics:
    description: "Aggregate FII derivatives statistics"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/all-reports-derivatives"
    frequency: "daily"
    required_fields: [trade_date, instrument_group, buy_contracts, sell_contracts, open_interest]
    status: "adapter_implemented_live_validation_pending"
    catalogue_api: "https://www.nseindia.com/api/daily-reports?key=FO"
    report_key: "FO-FII-DERIVATIVE-STAT"
    attribution_scope: "aggregate_fii_derivatives_only"
  nse_stock_mwpl:
    description: "Stock MWPL utilization and ban context reports"
    publisher: "National Stock Exchange of India"
    reference_url: "https://www.nseindia.com/all-reports-derivatives"
    frequency: "daily"
    required_fields: [trade_date, symbol]
    status: "source_verified_schema_pending"
