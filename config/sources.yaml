# Register every upstream dataset with provenance before ingestion.
# Source contracts are documented in docs/data-source-register.md.
sources:
  nse_nifty500_constituents:
    description: "Official current Nifty 500 constituent CSV snapshot"
    publisher: "NSE Indices"
    reference_url: "https://www.niftyindices.com/indices/equity/broad-based-indices/NIFTY-500"
    download_url: "https://www.niftyindices.com/IndexConstituent/ind_nifty500list.csv"
