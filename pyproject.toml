[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fii-accumulation-engine"
version = "0.1.0"
description = "Independent, evidence-based FII accumulation research across the Nifty 500."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary research project" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
