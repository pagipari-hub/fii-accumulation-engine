name: Official NSE MII reference masters

on:
  push:
    branches: [main]
    paths:
      - "src/fii_engine/nse_reference.py"
      - "tests/test_nse_reference.py"
      - "config/sources.yaml"
      - ".github/workflows/nse-reference-masters.yml"
  pull_request:
    paths:
      - "src/fii_engine/nse_reference.py"
      - "tests/test_nse_reference.py"
      - "config/sources.yaml"
      - ".github/workflows/nse-reference-masters.yml"
  workflow_dispatch:
  schedule:
    # 20:05 IST, Monday to Friday, after the daily report catalogue is published.
    - cron: "35 14 * * 1-5"

permissions:
  contents: read

concurrency:
  group: official-nse-reference-masters
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Prepare artifact directory
        run: mkdir -p artifacts/nse-reference/raw

      - name: Capture official NSE MII security and contract masters
        run: python -m fii_engine.nse_reference --output-dir artifacts/nse-reference

      - name: Print captured official NSE MII catalogue records
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          directory = Path("artifacts/nse-reference/catalogue")
          for path in sorted(directory.glob("*.json")):
              if path.name == "probe_manifest.json":
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              print(f"CATALOGUE FILE: {path}")
              print("TOP LEVEL:", sorted(payload))
              print("CURRENT DATE:", payload.get("currentDate"))
              for group in ("CurrentDay", "PreviousDay"):
                  records = payload.get(group, [])
                  selected = [
                      {
                          key: item.get(key)
                          for key in (
                              "fileKey", "fileActlName", "filePath",
                              "tradingDate", "displayName", "filePosition", "fileSize"
                          )
                      }
                      for item in records
                      if isinstance(item, dict)
                      and (
                          "mii" in str(item.get("displayName", "")).casefold()
                          or "security" in str(item.get("displayName", "")).casefold()
                          or "contract" in str(item.get("displayName", "")).casefold()
                      )
                  ]
                  print(f"{group} MII/SECURITY/CONTRACT RECORDS:")
                  print(json.dumps(selected, indent=2, ensure_ascii=False))
          manifest_path = Path("artifacts/nse-reference/manifest.json")
          if manifest_path.is_file():
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              fo = next(
                  (item for item in manifest.get("captures", [])
                   if item.get("dataset") == "nse_fo_contract_master"),
                  None,
              )
              if fo:
                  import csv
                  import gzip
                  import hashlib
                  import io
                  from urllib.request import Request, urlopen

                  raw_path = Path(fo["raw_artifact_path"])
                  with gzip.open(raw_path, "rt", encoding="utf-8-sig", newline="") as handle:
                      reader = csv.DictReader(handle)
                      samples = []
                      stock_expiries = []
                      for row in reader:
                          if len(samples) < 8:
                              samples.append({
                                  key: row.get(key)
                                  for key in (
                                      "FinInstrmNm", "TckrSymb", "XpryDt",
                                      "StockNm", "UndrlygInstrm", "FinInstrmTp"
                                  )
                              })
                          if row.get("FinInstrmNm") in {"FUTSTK", "OPTSTK"}:
                              value = row.get("XpryDt", "")
                              if value.isdigit():
                                  stock_expiries.append(int(value))
                  print("FO CONTRACT MASTER SAMPLE ROWS:")
                  print(json.dumps(samples, indent=2, ensure_ascii=False))
                  print("FO STOCK EXPIRY RAW RANGE:", {
                      "min": min(stock_expiries) if stock_expiries else None,
                      "max": max(stock_expiries) if stock_expiries else None,
                      "count": len(stock_expiries),
                  })

                  alternate_url = fo["download_url"].replace(
                      "nsearchives.nseindia.in", "nsearchives.nseindia.com"
                  )
                  try:
                      request = Request(
                          alternate_url,
                          headers={
                              "User-Agent": "Mozilla/5.0",
                              "Accept": "application/octet-stream,*/*",
                          },
                      )
                      with urlopen(request, timeout=30) as response:
                          alternate_payload = response.read()
                          print("FO .COM HOST COMPARISON:", {
                              "status": response.status,
                              "bytes": len(alternate_payload),
                              "sha256": hashlib.sha256(alternate_payload).hexdigest(),
                              "matches_catalogue_host_payload": (
                                  hashlib.sha256(alternate_payload).hexdigest()
                                  == fo["raw_sha256"]
                              ),
                          })
                  except Exception as exc:
                      print("FO .COM HOST COMPARISON FAILED:", repr(exc))
          PY

      - name: Validate capture manifest and source files
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("artifacts/nse-reference")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert len(manifest["captures"]) == 2
          if manifest.get("data_quality_status") != "pass":
              print("QUARANTINED SOURCE DATA:", manifest.get("data_quality_issues"))
              raise SystemExit("NSE MII source payload failed semantic freshness checks")
          assert {item["dataset"] for item in manifest["captures"]} == {
              "nse_cm_security_master", "nse_fo_contract_master"
          }
          for item in manifest["captures"]:
              path = Path(item["raw_artifact_path"])
              assert path.is_file() and path.stat().st_size > 0
              assert item["compressed_bytes"] == path.stat().st_size
              assert item["raw_sha256"]
              assert item["decompressed_bytes"] > 0
          print("Validated two NSE MII source captures.")
          PY

      - name: Upload immutable source captures and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-mii-reference-${{ github.run_id }}
          path: artifacts/nse-reference/
          if-no-files-found: warn
          retention-days: 90
