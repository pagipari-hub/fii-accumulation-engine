name: Official NSE participant and FII derivatives reports

on:
  push:
    branches: [main, research/shareholding-identity-integration]
    paths:
      - "src/fii_engine/nse_fo_aggregate_reports.py"
      - "tests/test_nse_fo_aggregate_reports.py"
      - "src/fii_engine/historical_features.py"
      - "tests/test_historical_features.py"
      - "data/raw/nse_fo_historical/**"
      - "pyproject.toml"
      - ".github/workflows/nse-fo-aggregate-reports.yml"
      - ".gitignore"
      - "scripts/retry_git_push.sh"
  pull_request:
    paths:
      - "src/fii_engine/nse_fo_aggregate_reports.py"
      - "tests/test_nse_fo_aggregate_reports.py"
      - "pyproject.toml"
      - ".github/workflows/nse-fo-aggregate-reports.yml"
      - ".gitignore"
      - "src/fii_engine/historical_features.py"
      - "tests/test_historical_features.py"
      - "scripts/retry_git_push.sh"
  workflow_dispatch:
  schedule:
    # 21:35 IST, Monday to Friday, after the derivatives reports are published.
    - cron: "5 16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: official-nse-fo-aggregate-reports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Capture official participant OI, volume and FII statistics
        if: github.event_name != 'pull_request'
        run: python -m fii_engine.nse_fo_aggregate_reports --repo-root .

      - name: Validate raw files and schema-inspection manifests
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          current_path = Path("data/raw/fno_aggregate_reports/current_manifest.json")
          assert current_path.is_file(), "aggregate report current manifest missing"
          current = json.loads(current_path.read_text(encoding="utf-8"))
          assert len(current["datasets"]) == 3
          cross = current["cross_source_reconciliation"]
          assert cross["comparison"]
          assert set(cross["comparisons"]) == {
              "index_futures", "stock_futures", "index_options", "stock_options"
          }
          for dataset in current["datasets"]:
              raw_path = Path(dataset["raw_path"])
              assert raw_path.is_file(), f"missing raw file: {raw_path}"
              raw_hash = hashlib.sha256(raw_path.read_bytes()).hexdigest()
              assert raw_hash == dataset["raw_sha256"]
              manifest_path = Path(dataset["manifest_path"])
              assert manifest_path.is_file(), f"missing provenance: {manifest_path}"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              assert manifest["raw_sha256"] == raw_hash
              assert manifest["inspection_error"] is None
              processed = Path(dataset["processed_path"])
              assert processed.is_file(), f"missing normalized CSV: {processed}"
              processed_hash = hashlib.sha256(processed.read_bytes()).hexdigest()
              assert processed_hash == dataset["processed_sha256"]
              assert dataset["normalized_row_count"] > 0
              snapshot = Path(dataset["snapshot_path"])
              assert snapshot.is_file(), f"missing immutable normalized snapshot: {snapshot}"
              assert hashlib.sha256(snapshot.read_bytes()).hexdigest() == dataset["snapshot_sha256"]
              snapshot = Path(dataset["snapshot_path"])
              assert snapshot.is_file(), f"missing immutable normalized snapshot: {snapshot}"
              assert hashlib.sha256(snapshot.read_bytes()).hexdigest() == dataset["snapshot_sha256"]
              print(json.dumps({
                  "dataset": dataset["dataset"],
                  "trade_date": dataset["trading_date"],
                  "filename": dataset["filename"],
                  "bytes": dataset["raw_bytes"],
                  "sha256": raw_hash,
                  "normalized_rows": dataset["normalized_row_count"],
                  "normalized_sha256": processed_hash,
                  "inspection": dataset["inspection"],
              }, indent=2, default=str))
          PY

      - name: Run complete project test suite
        run: pytest

      - name: Rebuild rolling features from validated historical archive
        run: python -m fii_engine.historical_features --repo-root .

      - name: Validate historical participant archive integration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/raw/historical_features/historical_features_current_manifest.json")
          assert path.is_file(), "historical feature manifest missing after rebuild"
          manifest = json.loads(path.read_text(encoding="utf-8"))
          archive_manifest = Path("data/raw/nse_fo_historical/historical_manifest.json")
          if archive_manifest.is_file():
              archive = json.loads(archive_manifest.read_text(encoding="utf-8"))
              assert manifest["participant_archive_complete_session_count"] == archive["complete_sessions"]
              assert manifest["participant_oi_session_count"] >= archive["complete_sessions"]
              assert manifest["participant_volume_session_count"] >= archive["complete_sessions"]
          print(json.dumps({
              "as_of_trade_date": manifest["as_of_trade_date"],
              "daily_stock_sessions": manifest["daily_stock_session_count"],
              "participant_archive_complete_sessions": manifest["participant_archive_complete_session_count"],
              "participant_oi_sessions": manifest["participant_oi_session_count"],
              "participant_volume_sessions": manifest["participant_volume_session_count"],
              "participant_archive_manifest_sha256": manifest["participant_archive_manifest_sha256"],
          }, indent=2))
          PY

      - name: Build blended Nifty 500 FPI evidence matrix
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/research/shareholding-identity-integration' }}"
        run: python -m fii_engine.fpi_evidence_blend --root .

      - name: Validate point-in-time full-universe evidence matrix
        if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/research/shareholding-identity-integration' }}"
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          historical = json.loads(Path(
              "data/raw/historical_features/historical_features_current_manifest.json"
          ).read_text(encoding="utf-8"))
          matrix_path = Path("data/raw/fpi_evidence_blend/fpi_evidence_matrix_current_manifest.json")
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          output_path = Path("data/raw/fpi_evidence_blend/fpi_evidence_matrix_current.csv")
          with output_path.open("r", encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))

          assert matrix["status"] == "complete"
          assert matrix["stock_count"] == 501
          assert len(rows) == 501
          assert matrix["ownership_parsed_verified_count"] == 494
          assert matrix["issuer_fallback_verified_count"] == 2
          assert matrix["reit_unitholding_verified_count"] == 3
          assert matrix["ownership_evidence_coverage_count"] == 499
          assert matrix["ownership_evidence_coverage_pct"] == 99.8
          assert matrix["ownership_unresolved_count"] == 1
          assert matrix["as_of_trade_date"] == historical["as_of_trade_date"]
          assert historical["participant_derivatives_window_cutoff_date"] == historical["as_of_trade_date"]
          assert historical["participant_derivatives_as_of_trade_date"] <= historical["participant_derivatives_window_cutoff_date"]
          assert historical["participant_oi_session_count"] == 60
          assert historical["participant_volume_session_count"] == 60
          assert historical["participant_archive_complete_session_count"] == 60
          assert historical["participant_derivatives_latest_observed_trade_date"] == "2026-11-17"
          assert matrix["participant_oi_session_count"] == 60
          assert matrix["participant_volume_session_count"] == 60
          assert matrix["participant_derivatives_as_of_trade_date"] == historical["participant_derivatives_as_of_trade_date"]
          nsdl = matrix["nsdl_market_flow_context"]
          assert nsdl["scope"] == "aggregate_market_wide_cash_equity_context_only"
          assert nsdl["stock_level_attribution"] is False
          assert nsdl["fpi"]["observed_days"] == 62
          assert nsdl["dii"]["observed_days"] == 62
          assert matrix["composite_score_status"] == "not_scored_independent_evidence_dimensions_only"

          print(json.dumps({
              "as_of_trade_date": matrix["as_of_trade_date"],
              "stock_count": matrix["stock_count"],
              "participant_oi_sessions_used": matrix["participant_oi_session_count"],
              "participant_volume_sessions_used": matrix["participant_volume_session_count"],
              "participant_as_of_trade_date": matrix["participant_derivatives_as_of_trade_date"],
              "participant_window_cutoff_date": historical["participant_derivatives_window_cutoff_date"],
              "participant_latest_observed_date_excluded_from_asof": matrix["participant_derivatives_latest_observed_trade_date"],
              "nsdl_fpi_observed_days": nsdl["fpi"]["observed_days"],
              "nsdl_dii_observed_days": nsdl["dii"]["observed_days"],
              "direct_fpi_client_gross_buy_candidates": matrix["direct_fpi_client_gross_buy_candidate_count"],
              "grade_1_count": matrix["grade_1_count"],
              "grade_2_count": matrix["grade_2_count"],
              "ownership_parsed_verified_count": matrix["ownership_parsed_verified_count"],
              "issuer_fallback_verified_count": matrix["issuer_fallback_verified_count"],
              "reit_unitholding_verified_count": matrix["reit_unitholding_verified_count"],
              "ownership_evidence_coverage_count": matrix["ownership_evidence_coverage_count"],
              "ownership_evidence_coverage_pct": matrix["ownership_evidence_coverage_pct"],
              "ownership_unresolved_count": matrix["ownership_unresolved_count"],
              "composite_score_status": matrix["composite_score_status"],
          }, indent=2))
          PY

      - name: Commit immutable report snapshots, historical features and blended matrix
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain data/raw/fno_aggregate_reports/manifests data/snapshots/fno_aggregate_reports data/raw/historical_features data/snapshots/historical_features data/raw/fpi_evidence_blend data/snapshots/fpi_evidence_blend)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/raw/fno_aggregate_reports/manifests data/snapshots/fno_aggregate_reports data/raw/historical_features data/snapshots/historical_features data/raw/fpi_evidence_blend data/snapshots/fpi_evidence_blend
            git commit -m "data: record NSE participant and FII report provenance"
            bash scripts/retry_git_push.sh "$GITHUB_REF_NAME"
          else
            echo "No new participant/FII report versions; manifests unchanged."
          fi

      - name: Upload original reports and schema inspection
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nse-fo-aggregate-reports-${{ github.run_id }}
          path: |
            data/raw/fno_aggregate_reports/*.csv
            data/raw/fno_aggregate_reports/*.xls
            data/raw/fno_aggregate_reports/current_manifest.json
            data/processed/fno_aggregate_reports/*.csv
            data/snapshots/fno_aggregate_reports/*.csv
            data/snapshots/fno_aggregate_reports/*.csv
            data/raw/fno_aggregate_reports/manifests/*.json
            data/raw/fpi_evidence_blend/*.csv
            data/raw/fpi_evidence_blend/*.json
            data/snapshots/fpi_evidence_blend/*.csv
          if-no-files-found: warn
          retention-days: 90
