name: Build blended Nifty 500 FPI evidence matrix

on:
  push:
    branches: [main, research/shareholding-identity-integration]
    paths:
      - "src/fii_engine/fpi_evidence_blend.py"
      - "tests/test_fpi_evidence_blend.py"
      - "config/sources.yaml"
      - "docs/fpi-evidence-blend.md"
      - ".github/workflows/fpi-evidence-blend.yml"
      - ".gitignore"
      - "scripts/retry_git_push.sh"
      - "data/raw/daily_stock_features/**"
      - "data/raw/historical_features/**"
      - "data/raw/nsdl_cash_flows/**"
      - "data/processed/nsdl_cash_flows.csv"
      - "data/processed/nsdl_cash_flow_context.json"
      - "data/raw/shareholding/**"
      - "data/raw/fpi_deal_attribution/**"
      - "data/raw/universe/nifty500_current.csv"
      - "data/snapshots/universe/**"
  pull_request:
    paths:
      - "src/fii_engine/fpi_evidence_blend.py"
      - "tests/test_fpi_evidence_blend.py"
      - "config/sources.yaml"
      - "docs/fpi-evidence-blend.md"
      - ".github/workflows/fpi-evidence-blend.yml"
      - ".gitignore"
      - "scripts/retry_git_push.sh"
      - "data/raw/daily_stock_features/**"
      - "data/raw/historical_features/**"
      - "data/raw/shareholding/**"
      - "data/raw/fpi_deal_attribution/**"
      - "data/raw/universe/nifty500_current.csv"
      - "data/snapshots/universe/**"
  workflow_dispatch:
  schedule:
    # 00:30 IST weekdays, after the daily registry/deal and stock-evidence collection window.
    - cron: "0 19 * * 1-5"

permissions:
  contents: write

concurrency:
  group: fpi-evidence-blend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blend:
    # On the integration branch, rebuild only after the historical-feature
    # workflow has committed its refreshed outputs; avoid concurrent writers.
    if: "${{ github.ref != 'refs/heads/research/shareholding-identity-integration' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run project tests
        run: pytest

      - name: Build blended evidence matrix
        run: python -m fii_engine.fpi_evidence_blend --root .

      - name: Validate full-universe matrix and provenance
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("data/raw/fpi_evidence_blend/fpi_evidence_matrix_current_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          output_path = Path(manifest["current_output_path"])
          payload = output_path.read_bytes()
          assert hashlib.sha256(payload).hexdigest() == manifest["output_csv_sha256"]
          with output_path.open("r", encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          assert manifest["status"] == "complete"
          assert manifest["stock_count"] == 501
          assert len(rows) == 501
          assert manifest["composite_score_status"] == "not_scored_independent_evidence_dimensions_only"
          assert manifest["universe_snapshot_manifest_path"]
          assert manifest["source_hashes"]["daily_stock_features"]
          assert manifest["source_hashes"]["historical_stock_features"]
          assert manifest["source_hashes"]["fpi_deal_stock_summary"]
          assert manifest["source_hashes"]["shareholding_ownership"]
          historical = json.loads(Path(
              "data/raw/historical_features/historical_features_current_manifest.json"
          ).read_text(encoding="utf-8"))
          assert historical["participant_archive_complete_session_count"] == 60
          assert historical["participant_oi_session_count"] == 60
          assert historical["participant_volume_session_count"] == 60
          assert historical["participant_derivatives_window_cutoff_date"] == historical["as_of_trade_date"]
          assert historical["participant_derivatives_as_of_trade_date"] <= historical["participant_derivatives_window_cutoff_date"]
          assert historical["participant_derivatives_latest_observed_trade_date"] >= historical["participant_derivatives_as_of_trade_date"]
          assert historical["participant_oi_available_session_count"] >= 60
          assert historical["participant_volume_available_session_count"] >= 60
          nsdl = manifest["nsdl_market_flow_context"]
          assert nsdl["scope"] == "aggregate_market_wide_cash_equity_context_only"
          assert nsdl["stock_level_attribution"] is False
          assert nsdl["fpi"]["observed_days"] == 62
          assert nsdl["dii"]["observed_days"] == 62
          print(json.dumps({
              "as_of_trade_date": manifest["as_of_trade_date"],
              "stock_count": manifest["stock_count"],
              "direct_fpi_client_gross_buy_candidate_count": manifest["direct_fpi_client_gross_buy_candidate_count"],
              "grade_1_count": manifest["grade_1_count"],
              "grade_2_count": manifest["grade_2_count"],
              "ownership_reporting_date": manifest["ownership_reporting_date"],
              "ownership_parsed_verified_count": manifest["ownership_parsed_verified_count"],
              "ownership_coverage_pct": manifest["ownership_coverage_pct"],
              "market_flow_session_count": manifest["market_flow_session_count"],
              "participant_oi_session_count": manifest["participant_oi_session_count"],
              "participant_volume_session_count": manifest["participant_volume_session_count"],
              "participant_archive_complete_session_count": historical["participant_archive_complete_session_count"],
              "participant_derivatives_as_of_trade_date": historical["participant_derivatives_as_of_trade_date"],
              "participant_derivatives_window_cutoff_date": historical["participant_derivatives_window_cutoff_date"],
              "participant_derivatives_latest_observed_trade_date": historical["participant_derivatives_latest_observed_trade_date"],
              "nsdl_fpi_observed_days": nsdl["fpi"]["observed_days"],
              "nsdl_dii_observed_days": nsdl["dii"]["observed_days"],
              "composite_score_status": manifest["composite_score_status"],
          }, indent=2))
          PY

      - name: Upload blended evidence outputs
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fpi-evidence-blend-${{ github.run_id }}
          path: |
            data/raw/fpi_evidence_blend/
            data/snapshots/fpi_evidence_blend/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit blended evidence outputs
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain data/raw/fpi_evidence_blend data/snapshots/fpi_evidence_blend)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/raw/fpi_evidence_blend data/snapshots/fpi_evidence_blend
            git commit -m "data: build blended Nifty 500 FPI evidence matrix"
            bash scripts/retry_git_push.sh "$GITHUB_REF_NAME"
          else
            echo "Blended FPI evidence matrix unchanged."
          fi
