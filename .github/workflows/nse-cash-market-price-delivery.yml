name: Official NSE cash market prices and delivery

on:
  push:
    branches: [main]
    paths:
      - "src/fii_engine/nse_cash_market.py"
      - "tests/test_nse_cash_market.py"
      - "config/sources.yaml"
      - ".github/workflows/nse-cash-market-price-delivery.yml"
  pull_request:
    paths:
      - "src/fii_engine/nse_cash_market.py"
      - "tests/test_nse_cash_market.py"
      - "config/sources.yaml"
      - ".github/workflows/nse-cash-market-price-delivery.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: official-nse-cash-market-price-delivery
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Capture official NSE cash prices and delivery data
        if: github.event_name != 'pull_request'
        run: python -m fii_engine.nse_cash_market --repo-root .
      - name: Validate captured source files and manifests
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          current_path = Path("data/raw/cash_market/nse_cm_cash_current_manifest.json")
          assert current_path.is_file(), "current NSE cash-market manifest missing"
          current = json.loads(current_path.read_text(encoding="utf-8"))
          assert current["finality"] == "final"
          assert len(current["datasets"]) == 2
          assert current["datasets"][0]["trade_date"] == current["datasets"][1]["trade_date"]
          for dataset in current["datasets"]:
              raw = Path(dataset["raw_path"])
              manifest = Path(dataset["manifest_path"])
              assert raw.is_file() and manifest.is_file()
              assert hashlib.sha256(raw.read_bytes()).hexdigest() == dataset["raw_sha256"]
              detail = json.loads(manifest.read_text(encoding="utf-8"))
              assert detail["raw_sha256"] == dataset["raw_sha256"]
              assert detail["trade_date"] == current["trade_date"]
              assert detail["validation"]["row_count"] > 0
              if dataset["parsed_path"]:
                  parsed = Path(dataset["parsed_path"])
                  assert parsed.is_file()
                  assert hashlib.sha256(parsed.read_bytes()).hexdigest() == dataset["parsed_sha256"]
          print(json.dumps({
              "trade_date": current["trade_date"],
              "datasets": [{
                  "path": d["raw_path"],
                  "rows": d["validation"]["row_count"],
                  "symbols": d["validation"]["distinct_symbols"],
                  "schema_sha256": d["validation"]["schema_sha256"],
              } for d in current["datasets"]],
          }, indent=2))
          PY
      - name: Run complete project test suite
        run: pytest
      - name: Commit immutable source manifests
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain data/raw/cash_market/manifests)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/raw/cash_market/manifests
            git commit -m "data: record NSE cash market source provenance"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          else
            echo "No new cash-market source versions."
          fi
      - name: Upload original files, parsed UDiFF and current manifest
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nse-cash-market-${{ github.run_id }}
          path: |
            data/raw/cash_market/*.zip
            data/raw/cash_market/*.csv
            data/raw/cash_market/*_current_manifest.json
            data/raw/cash_market/manifests/*.json
            data/processed/cash_market/*.csv
          if-no-files-found: warn
          retention-days: 90
