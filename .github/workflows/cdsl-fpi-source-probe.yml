name: Official CDSL FPI source discovery

on:
  push:
    branches: [main]
    paths:
      - "src/fii_engine/cdsl_fpi_probe.py"
      - "tests/test_cdsl_fpi_probe.py"
      - ".github/workflows/cdsl-fpi-source-probe.yml"
  pull_request:
    paths:
      - "src/fii_engine/cdsl_fpi_probe.py"
      - "tests/test_cdsl_fpi_probe.py"
      - ".github/workflows/cdsl-fpi-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdsl-fpi-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run project tests
        run: pytest

      - name: Probe official CDSL pages
        if: github.event_name != 'pull_request'
        run: python -m fii_engine.cdsl_fpi_probe --output-dir artifacts/cdsl_probe

      - name: Upload CDSL source discovery artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cdsl-fpi-source-probe-${{ github.run_id }}
          path: artifacts/cdsl_probe/
          if-no-files-found: warn
          retention-days: 30
