name: Official NSE bulk and block deals

on:
  push:
    branches: [main]
    paths:
      - "src/fii_engine/nse_bulk_block_deals.py"
      - "tests/test_nse_bulk_block_deals.py"
      - "config/sources.yaml"
      - ".github/workflows/nse-bulk-block-deals.yml"
      - "scripts/retry_git_push.sh"
  pull_request:
    paths:
      - "src/fii_engine/nse_bulk_block_deals.py"
      - "tests/test_nse_bulk_block_deals.py"
      - "config/sources.yaml"
      - ".github/workflows/nse-bulk-block-deals.yml"
      - "scripts/retry_git_push.sh"
  workflow_dispatch:
  schedule:
    # 22:15 IST, Monday to Friday; query the last 7 calendar days.
    - cron: "45 16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: official-nse-bulk-block-deals
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Capture official NSE bulk and block deal disclosures
        if: github.event_name != 'pull_request'
        run: python -m fii_engine.nse_bulk_block_deals --repo-root .
      - name: Validate raw responses, snapshots and provenance
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          current_path = Path("data/raw/bulk_block_deals/current_manifest.json")
          assert current_path.is_file(), "current NSE deals manifest missing"
          current = json.loads(current_path.read_text(encoding="utf-8"))
          assert current["requested_from"] <= current["requested_to"]
          assert len(current["datasets"]) == 2
          for dataset in current["datasets"]:
              assert dataset["json_is_subset_of_csv"] is True
              raw_csv = Path(dataset["raw_csv"]["path"])
              raw_json = Path(dataset["raw_json"]["path"])
              assert raw_csv.is_file() and raw_json.is_file()
              assert hashlib.sha256(raw_csv.read_bytes()).hexdigest() == dataset["raw_csv"]["sha256"]
              assert hashlib.sha256(raw_json.read_bytes()).hexdigest() == dataset["raw_json"]["sha256"]
              for snapshot_info in dataset["snapshots"]:
                  snapshot = Path(snapshot_info["snapshot_path"])
                  manifest = Path(snapshot_info["manifest_path"])
                  assert snapshot.is_file() and manifest.is_file()
                  assert hashlib.sha256(snapshot.read_bytes()).hexdigest() == snapshot_info["snapshot_sha256"]
                  detail = json.loads(manifest.read_text(encoding="utf-8"))
                  assert detail["snapshot_sha256"] == snapshot_info["snapshot_sha256"]
                  assert detail["trade_date"] == snapshot_info["trade_date"]
          print(json.dumps({
              "from": current["requested_from"],
              "to": current["requested_to"],
              "datasets": [{
                  "deal_type": d["deal_type"],
                  "csv_rows": d["csv_row_count"],
                  "json_rows": d["json_row_count"],
                  "json_complete_for_range": d["json_complete_for_range"],
                  "json_coverage_ratio": d["json_coverage_ratio"],
                  "daily_snapshots": d["snapshots"],
              } for d in current["datasets"]],
          }, indent=2))
          PY
      - name: Run complete project test suite
        run: pytest
      - name: Commit immutable normalized daily snapshots and manifests
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain data/snapshots/bulk_block_deals data/raw/bulk_block_deals/manifests)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/snapshots/bulk_block_deals data/raw/bulk_block_deals/manifests
            git commit -m "data: record NSE bulk block deal disclosures"
            bash scripts/retry_git_push.sh "$GITHUB_REF_NAME"
          else
            echo "No new NSE bulk/block deal snapshot versions."
          fi
      - name: Upload raw responses, current manifest and snapshots
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nse-bulk-block-deals-${{ github.run_id }}
          path: |
            data/raw/bulk_block_deals/*.csv
            data/raw/bulk_block_deals/*.json
            data/raw/bulk_block_deals/manifests/*.json
            data/snapshots/bulk_block_deals/*.csv
          if-no-files-found: warn
          retention-days: 90
