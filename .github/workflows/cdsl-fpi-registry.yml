name: Official CDSL registered FPI directory

on:
  push:
    branches: [main]
    paths:
      - "src/fii_engine/cdsl_fpi_registry.py"
      - "tests/test_cdsl_fpi_registry.py"
      - "config/sources.yaml"
      - "docs/cdsl-fpi-source-research.md"
      - ".github/workflows/cdsl-fpi-registry.yml"
      - ".gitignore"
      - "scripts/retry_git_push.sh"
  pull_request:
    paths:
      - "src/fii_engine/cdsl_fpi_registry.py"
      - "tests/test_cdsl_fpi_registry.py"
      - "config/sources.yaml"
      - "docs/cdsl-fpi-source-research.md"
      - ".github/workflows/cdsl-fpi-registry.yml"
      - ".gitignore"
      - "scripts/retry_git_push.sh"
  workflow_dispatch:
  schedule:
    # 23:45 IST weekdays, after the NSE daily deal disclosures.
    - cron: "15 18 * * 1-5"

permissions:
  contents: write

concurrency:
  group: cdsl-fpi-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run project tests
        run: pytest

      - name: Collect all 26 official CDSL FPI registry pages
        if: github.event_name != 'pull_request'
        run: python -m fii_engine.cdsl_fpi_registry --output-dir artifacts/cdsl_fpi_registry --data-dir .

      - name: Validate registry output
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("data/raw/cdsl_fpi_registry/cdsl_fpi_registry_current_manifest.json").read_text())
          assert manifest["status"] == "complete"
          assert manifest["successful_letter_pages"] == 26
          assert manifest["record_count"] >= 10000
          csv_path = Path(manifest["normalized_csv_path"])
          assert csv_path.exists()
          assert manifest["normalized_csv_sha256"]
          print(json.dumps({k: manifest[k] for k in (
              "record_count", "unique_registration_number_count",
              "unique_normalized_name_count", "duplicate_registration_number_excess",
              "duplicate_normalized_name_excess", "validity_date_parse_error_count",
          )}, indent=2))
          PY

      - name: Upload raw CDSL registry pages and normalized outputs
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cdsl-fpi-registry-${{ github.run_id }}
          path: |
            artifacts/cdsl_fpi_registry/
            data/raw/cdsl_fpi_registry/
            data/snapshots/cdsl_fpi_registry/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit normalized registry snapshot
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain data/raw/cdsl_fpi_registry data/snapshots/cdsl_fpi_registry)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/raw/cdsl_fpi_registry data/snapshots/cdsl_fpi_registry
            git commit -m "data: refresh official CDSL registered FPI directory"
            bash scripts/retry_git_push.sh "$GITHUB_REF_NAME"
          else
            echo "CDSL FPI registry snapshot unchanged."
          fi
