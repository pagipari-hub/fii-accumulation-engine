name: Yahoo Finance price smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yahoo-price-smoke
  cancel-in-progress: false

jobs:
  yahoo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install market-data adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[market-data]"

      - name: Fetch a small NSE symbol sample
        run: |
          python -m fii_engine.yahoo_prices \
            --symbols-file config/samples/yahoo-smoke-symbols.csv \
            --period 1mo \
            --interval 1d \
            --output artifacts/market-data/yahoo

      - name: Validate completeness and output schema
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("artifacts/market-data/yahoo")
          manifest = json.loads((root / "yahoo_prices_manifest.json").read_text())
          expected = {"HDFCBANK", "ICICIBANK", "RELIANCE"}
          returned = set(manifest["returned_symbols"])
          missing = sorted(expected - returned)
          if missing:
              raise SystemExit(f"Missing expected symbols: {missing}")
          with (root / "yahoo_prices.csv").open(newline="") as handle:
              rows = list(csv.DictReader(handle))
          if not rows:
              raise SystemExit("Price CSV contains no rows")
          required = {"date", "symbol", "open", "high", "low", "close", "adj_close", "volume"}
          if not required.issubset(rows[0]):
              raise SystemExit(f"Missing output columns: {sorted(required - set(rows[0]))}")
          print(json.dumps({
              "provider": manifest["provider"],
              "retrieved_at_utc": manifest["retrieved_at_utc"],
              "requested_tickers": manifest["requested_tickers"],
              "returned_symbols": manifest["returned_symbols"],
              "row_count": manifest["row_count"],
              "missing_symbols": missing,
          }, indent=2))
          PY

      - name: Upload Yahoo price sample and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-price-smoke-${{ github.run_id }}
          path: artifacts/market-data/yahoo/
          if-no-files-found: warn
          retention-days: 14
