name: Official Nifty 500 universe refresh

on:
  push:
    paths:
      - "src/fii_engine/nifty500_universe.py"
      - "config/sources.yaml"
      - ".github/workflows/nifty500-universe.yml"
  workflow_dispatch:
  schedule:
    # Weekly check, Monday 09:47 IST. Commit only when the official snapshot changes.
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: official-nifty500-universe
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ingest official NSE Nifty 500 constituents
        run: python -m fii_engine.nifty500_universe --repo-root .

      - name: Validate project tests
        run: |
          python -m pip install -e ".[dev]"
          pytest

      - name: Commit changed official snapshot
        run: |
          if [[ -n "$(git status --porcelain data/raw/universe data/snapshots/universe)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/raw/universe data/snapshots/universe
            git commit -m "data: refresh official Nifty 500 universe"
            git push
          else
            echo "Official constituent snapshot unchanged; no commit required."
          fi
