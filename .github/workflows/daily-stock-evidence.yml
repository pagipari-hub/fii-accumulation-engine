name: Daily Nifty 500 stock evidence matrix

on:
  push:
    branches: [main]
    paths:
      - "src/fii_engine/daily_stock_features.py"
      - "src/fii_engine/daily_pipeline.py"
      - "src/fii_engine/historical_features.py"
      - "tests/test_daily_stock_features.py"
      - "tests/test_historical_features.py"
      - "src/fii_engine/nse_historical_archive_probe.py"
      - "tests/test_nse_historical_archive_probe.py"
      - "docs/daily-stock-evidence-matrix.md"
      - ".github/workflows/daily-stock-evidence.yml"
      - ".gitignore"
  pull_request:
    paths:
      - "src/fii_engine/daily_stock_features.py"
      - "src/fii_engine/daily_pipeline.py"
      - "src/fii_engine/historical_features.py"
      - "tests/test_daily_stock_features.py"
      - "tests/test_historical_features.py"
      - "docs/daily-stock-evidence-matrix.md"
      - ".github/workflows/daily-stock-evidence.yml"
      - ".gitignore"
  workflow_dispatch:
  schedule:
    # 23:00 IST, Monday to Friday; after the individual daily collectors.
    - cron: "30 17 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-nifty500-stock-evidence
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run complete project test suite
        run: pytest

      - name: Collect official sources and build daily matrix
        if: github.event_name != 'pull_request'
        run: python -m fii_engine.daily_pipeline --repo-root .

      - name: Summarize source coverage
        if: always() && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/raw/daily_stock_features/collector_run_status.json")
          if not path.is_file():
              print("### Daily stock evidence")
              print("No collector status file was produced.")
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          print("### Daily Nifty 500 stock evidence")
          print(f"- Pipeline status: **{report.get('pipeline_status', 'unknown')}**")
          matrix = report.get("matrix", {})
          print(f"- Trade date: {matrix.get('trade_date', 'unavailable')}")
          print(f"- Rows: {matrix.get('row_count', 0)}")
          print(f"- Scoring: {matrix.get('scoring_status', 'not produced')}")
          history = report.get("historical_features", {})
          print(f"- Historical evidence: {history.get('status', 'not produced')}")
          print(f"  - Stock sessions: {history.get('daily_stock_session_count', 0)}")
          print(f"  - FII/DII sessions: {history.get('market_flow_session_count', 0)}")
          print(f"  - Participant OI sessions: {history.get('participant_oi_session_count', 0)}")
          print(f"  - Participant volume sessions: {history.get('participant_volume_session_count', 0)}")
          print("- Collector status:")
          for name, result in report.get("collectors", {}).items():
              print(f"  - {name}: {result.get('status', 'unknown')}")
          PY

      - name: Upload raw sources, normalized inputs and evidence matrix
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: daily-stock-evidence-${{ github.run_id }}
          path: |
            data/raw/**
            data/processed/**
            data/snapshots/**
          if-no-files-found: warn
          retention-days: 90

      - name: Commit daily evidence matrix only
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          trade_date=$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/raw/daily_stock_features/collector_run_status.json")
          if path.is_file():
              report = json.loads(path.read_text(encoding="utf-8"))
              print(report.get("matrix", {}).get("trade_date") or "")
          PY
          )
          committed=false
          if [[ -n "$trade_date" ]]; then
            git add data/raw/daily_stock_features data/snapshots/daily_stock_features data/raw/historical_features data/snapshots/historical_features
            if ! git diff --cached --quiet; then
              git commit -m "data: record daily Nifty 500 stock evidence matrix"
              committed=true
            fi
          else
            echo "No current market trade date; matrix not committed."
          fi
          # Collectors write temporary source files and may refresh tracked
          # current pointers. Their own workflows persist those source datasets.
          # The fused matrix has already been committed above and the raw run
          # inputs have already been uploaded as an artifact.
          git restore --worktree .
          git clean -fdx
          if [[ "$committed" == "true" ]]; then
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No new daily evidence snapshot to push."
          fi
