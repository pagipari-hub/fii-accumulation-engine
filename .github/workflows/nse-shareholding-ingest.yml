name: Official NSE quarterly FPI ownership ingestion

on:
  push:
    branches: [main, research/shareholding-identity-integration]
    paths:
      - "src/fii_engine/nse_shareholding_xbrl.py"
      - "src/fii_engine/nse_shareholding_ingest.py"
      - "src/fii_engine/fpi_evidence_blend.py"
      - "tests/test_fpi_evidence_blend.py"
      - "src/fii_engine/nse_security_master_probe.py"
      - "src/fii_engine/nse_shareholding_xbrl_entity_probe.py"
      - "src/fii_engine/bse_shareholding_scripcode_crosswalk.py"
      - "data/audits/shareholding_isin_mismatch_candidates_2026-09-30.csv"
      - "tests/test_nse_shareholding_xbrl.py"
      - "tests/test_nse_shareholding_ingest.py"
      - "config/sources.yaml"
      - "docs/nse-shareholding-pattern.md"
      - ".github/workflows/nse-shareholding-ingest.yml"
      - ".gitignore"
      - "scripts/retry_git_push.sh"
  pull_request:
    paths:
      - "src/fii_engine/nse_shareholding_xbrl.py"
      - "src/fii_engine/nse_shareholding_ingest.py"
      - "src/fii_engine/nse_security_master_probe.py"
      - "src/fii_engine/nse_shareholding_xbrl_entity_probe.py"
      - "src/fii_engine/bse_shareholding_scripcode_crosswalk.py"
      - "data/audits/shareholding_isin_mismatch_candidates_2026-09-30.csv"
      - "tests/test_nse_shareholding_xbrl.py"
      - "tests/test_nse_shareholding_ingest.py"
      - "config/sources.yaml"
      - "docs/nse-shareholding-pattern.md"
      - ".github/workflows/nse-shareholding-ingest.yml"
      - ".gitignore"
      - "scripts/retry_git_push.sh"
  workflow_dispatch:
  schedule:
    # 21:00 IST, Monday; captures newly filed quarterly reports and revisions.
    - cron: "30 15 * * 1"

permissions:
  contents: write

concurrency:
  group: nse-shareholding-ownership
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run complete project test suite
        run: pytest

      - name: Rebuild dated 2026-09-30 BSE identity evidence
        if: github.event_name != 'pull_request'
        run: |
          python -m fii_engine.nse_security_master_probe --historical-date 2026-09-30 --output-dir artifacts/nse-security-master-probe
          python -m fii_engine.nse_shareholding_xbrl_entity_probe --candidates data/audits/shareholding_isin_mismatch_candidates_2026-09-30.csv --output-dir artifacts/nse-security-master-probe
          python -m fii_engine.bse_shareholding_scripcode_crosswalk --candidates data/audits/shareholding_isin_mismatch_candidates_2026-09-30.csv --xbrl-report artifacts/nse-security-master-probe/shareholding_xbrl_entity_probe.json --output-dir artifacts/nse-security-master-probe --reporting-date 2026-09-30
          mkdir -p data/raw/shareholding/identity_evidence
          cp artifacts/nse-security-master-probe/shareholding_bse_scripcode_isin_crosswalk.csv data/raw/shareholding/identity_evidence/
          cp artifacts/nse-security-master-probe/shareholding_bse_scripcode_isin_crosswalk.json data/raw/shareholding/identity_evidence/
          cp artifacts/nse-security-master-probe/BhavCopy_BSE_CM_0_0_0_20260930_F_0000_*.csv data/raw/shareholding/identity_evidence/
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path("data/raw/shareholding/identity_evidence/shareholding_bse_scripcode_isin_crosswalk.json")
          value = json.loads(report.read_text(encoding="utf-8"))
          raw = next(Path("data/raw/shareholding/identity_evidence").glob("BhavCopy_BSE_CM_0_0_0_20260930_F_0000_*.csv"))
          value["bse_source_path"] = raw.name
          report.write_text(json.dumps(value, indent=2) + "\\n", encoding="utf-8")
          PY

      - name: Capture official NSE shareholding filings and FPI ownership
        if: github.event_name != 'pull_request'
        run: python -m fii_engine.nse_shareholding_ingest --repo-root . --identity-crosswalk data/raw/shareholding/identity_evidence/shareholding_bse_scripcode_isin_crosswalk.csv

      - name: Validate filing, identity and ownership provenance
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          manifest_path = root / "data/raw/shareholding/current_manifest.json"
          assert manifest_path.is_file(), "NSE shareholding current manifest missing"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assert manifest["status"] in {
              "complete", "partial_identity_coverage", "partial_xbrl_coverage"
          }
          assert manifest["current_universe_count"] >= 480
          assert manifest["identity_crosswalk"]["verified_count"] == 143
          master_raw = root / manifest["master_raw_path"]
          assert master_raw.is_file()
          assert hashlib.sha256(master_raw.read_bytes()).hexdigest() == manifest["master_raw_sha256"]
          master_snapshot = root / manifest["master_snapshot_path"]
          assert master_snapshot.is_file()
          assert hashlib.sha256(master_snapshot.read_bytes()).hexdigest() == manifest["master_snapshot_sha256"]
          ownership_snapshot = root / manifest["ownership_snapshot_path"]
          assert ownership_snapshot.is_file()
          assert hashlib.sha256(ownership_snapshot.read_bytes()).hexdigest() == manifest["ownership_snapshot_sha256"]
          ownership_current = root / manifest["ownership_current_path"]
          assert ownership_current.is_file()
          assert hashlib.sha256(ownership_current.read_bytes()).hexdigest() == manifest["ownership_current_sha256"]
          with ownership_current.open(newline="", encoding="utf-8") as handle:
              ownership_rows = list(csv.DictReader(handle))
          assert len(ownership_rows) == manifest["ownership_row_count"]
          assert len(ownership_rows) >= manifest["current_universe_count"]
          for relative in manifest["filing_snapshot_paths"]:
              filing_path = root / relative
              assert filing_path.is_file(), f"missing normalized filing: {filing_path}"
              filing = json.loads(filing_path.read_text(encoding="utf-8"))
              assert filing["filing"]["record_id"]
              assert filing["parsed"]["reporting_dates"] == [filing["filing"]["reporting_date"]]
          for item in manifest["raw_xbrl_refs"]:
              raw = root / item["path"]
              assert raw.is_file(), f"missing raw XBRL: {raw}"
              assert hashlib.sha256(raw.read_bytes()).hexdigest() == item["sha256"]
          print(json.dumps({
              "status": manifest["status"],
              "reporting_dates": manifest["reporting_dates"],
              "universe_count": manifest["current_universe_count"],
              "master_records": manifest["master_records_for_current_universe"],
              "identity_status_counts": manifest["identity_status_counts"],
              "eligible_filings": manifest["eligible_filing_count"],
              "newly_fetched": manifest["fetched_filing_count"],
              "reused": manifest["reused_filing_count"],
              "fetch_errors": manifest["fetch_error_count"],
              "latest_quarter_coverage_pct": manifest["latest_quarter_coverage_pct"],
              "ownership_rows": manifest["ownership_row_count"],
          }, indent=2))
          PY

      - name: Rebuild full-universe FPI evidence matrix from refreshed ownership
        if: github.event_name != 'pull_request'
        run: python -m fii_engine.fpi_evidence_blend --root .

      - name: Validate full-universe evidence matrix
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path
          manifest_path = Path("data/raw/fpi_evidence_blend/fpi_evidence_matrix_current_manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          output = Path(manifest["current_output_path"])
          assert hashlib.sha256(output.read_bytes()).hexdigest() == manifest["output_csv_sha256"]
          with output.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert manifest["status"] == "complete"
          assert manifest["stock_count"] == 501 and len(rows) == 501
          assert manifest["composite_score_status"] == "not_scored_independent_evidence_dimensions_only"
          assert manifest["source_hashes"]["shareholding_identity_crosswalk"]
          print(json.dumps({
              "stock_count": manifest["stock_count"],
              "ownership_parsed_verified_count": manifest["ownership_parsed_verified_count"],
              "ownership_coverage_pct": manifest["ownership_coverage_pct"],
              "ownership_status_counts": manifest["ownership_status_counts"],
              "as_of_trade_date": manifest["as_of_trade_date"],
              "composite_score_status": manifest["composite_score_status"],
          }, indent=2))
          PY

      - name: Upload raw master, XBRL and normalized filing evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nse-shareholding-ingest-${{ github.run_id }}
          path: |
            data/raw/shareholding/
            artifacts/nse-security-master-probe/
            data/raw/shareholding/identity_evidence/
            data/snapshots/shareholding_master/
            data/snapshots/shareholding_filings/
            data/snapshots/shareholding_ownership/
            data/raw/fpi_evidence_blend/
            data/snapshots/fpi_evidence_blend/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit normalized append-only filings and ownership snapshots
        if: github.event_name != 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain data/snapshots/shareholding_master data/snapshots/shareholding_filings data/snapshots/shareholding_ownership data/raw/shareholding/current_manifest.json data/raw/shareholding/shareholding_ownership_current.csv data/raw/shareholding/identity_evidence data/raw/fpi_evidence_blend data/snapshots/fpi_evidence_blend)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/snapshots/shareholding_master data/snapshots/shareholding_filings data/snapshots/shareholding_ownership data/raw/shareholding/current_manifest.json data/raw/shareholding/shareholding_ownership_current.csv data/raw/shareholding/identity_evidence data/raw/fpi_evidence_blend data/snapshots/fpi_evidence_blend
            git commit -m "data: record official NSE quarterly FPI ownership"
            bash scripts/retry_git_push.sh "$GITHUB_REF_NAME"
          else
            echo "No new shareholding filing or ownership snapshots."
          fi
